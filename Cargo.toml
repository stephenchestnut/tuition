[package]
name = "tuition"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A tiny command-driven terminal slide presenter"
repository = "https://github.com/stephenchestnut/tuition"
homepage = "https://github.com/stephenchestnut/tuition"
documentation = "https://docs.rs/tuition"
readme = "README.md"
keywords = ["cli", "terminal", "slides", "presentation", "rust"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
portable-pty = "0.9"
printpdf = { version = "0.7", features = ["embedded_images"] }
vt100 = "0.15"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
